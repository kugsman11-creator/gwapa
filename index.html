<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Camera</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      border-radius: 18px;
      background: #111;
      display: none;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #stopButton {
      display: none;
      background: #dc2626;
      margin-top: 10px;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>📹 Live Camera</h1>

    <p>
      Turn on your camera with your permission.
    </p>

    <button id="startButton">
      Turn On Camera
    </button>

    <button id="stopButton">
      Stop Camera
    </button>

    <p id="status">
      Camera is off.
    </p>

    <video id="camera" autoplay playsinline></video>

  </div>

  <script>

    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const video = document.getElementById("camera");
    const status = document.getElementById("status");

    let stream = null;

    startButton.addEventListener("click", async function() {

      try {

        status.textContent = "Requesting camera permission...";

        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";

        startButton.style.display = "none";
        stopButton.style.display = "block";

        status.textContent = "🟢 Camera is ON.";

      } catch (error) {

        status.textContent =
          "❌ Camera permission was denied or unavailable.";

        console.log(error);

      }

    });
