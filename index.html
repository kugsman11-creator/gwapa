<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 18px;
      background: #111;
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>📹 Live Camera</h1>

    <p>
      Turn on your camera with your permission.
    </p>

    <button id="startButton">
      Turn On Camera
    </button>

    <p id="status">
      Camera is off.
    </p>

    <video id="camera" autoplay playsinline></video>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyBuv5MdRQ92PDoh1uG7Ef4cFDUYvkwLUq4",

      authDomain: "gwapa-436c1.firebaseapp.com",

      databaseURL:
        "https://gwapa-436c1-default-rtdb.firebaseio.com",

      projectId: "gwapa-436c1",

      storageBucket:
        "gwapa-436c1.firebasestorage.app",

      messagingSenderId: "783722665776",

      appId:
        "1:783722665776:web:dc68aecf1bad7fef905af5"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const auth = getAuth(app);


    try {

      await signInAnonymously(auth);

      console.log("Firebase connected.");

    } catch (error) {

      console.error("Firebase error:", error);

    }


    const startButton =
      document.getElementById("startButton");

    const video =
      document.getElementById("camera");

    const status =
      document.getElementById("status");


    let stream = null;


    startButton.addEventListener("click", async function() {

      try {

        status.textContent =
          "Requesting camera permission...";

        stream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

        video.srcObject = stream;

        video.style.display = "block";

        startButton.style.display = "none";

        status.textContent =
          "🟢 Camera is ON.";

      } catch (error) {

        status.textContent =
          "❌ Camera permission denied.";

        console.error(error);

      }

    });

  </script>

</body>
</html>
